<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Chocolate Day 🍫❤️</title>

<style>
body{
  margin:0;
  background:linear-gradient(180deg,#2b0015,#000);
  font-family:'Segoe UI',sans-serif;
  text-align:center;
  color:white;
  overflow:hidden;
}

h1{
  margin-top:20px;
  color:#ff7a9c;
  text-shadow:0 0 15px #ff4d6d;
}

.message{
  padding:15px;
  font-size:16px;
  line-height:1.6;
  opacity:.9;
}

.chocolate{
  font-size:90px;
  cursor:pointer;
  animation:bounce 2s infinite;
  margin-top:30px;
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

/* Wrapper Animation */
.unwrap{
  animation:unwrap 1.5s forwards;
}

@keyframes unwrap{
  0%{transform:scale(1) rotate(0);}
  50%{transform:scale(1.2) rotate(10deg);}
  100%{transform:scale(0); opacity:0;}
}

/* Video Box */
.video-box{
  display:none;
  margin:20px auto;
  width:90%;
  max-width:360px;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(255,105,135,.6);
}

video{
  width:100%;
  display:block;
}

/* Hearts */
.heart{
  position:fixed;
  bottom:-20px;
  font-size:20px;
  animation:floatUp 6s linear infinite;
  opacity:.8;
}

@keyframes floatUp{
  0%{transform:translateY(0);opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-100vh);opacity:0;}
}

.footer{
  margin:20px;
  color:#ffb3c6;
  font-size:15px;
}
</style>
</head>

<body>

<h1>Happy Chocolate Day 🍫❤️</h1>

<div class="message">
  Hey <b>Lokesh</b> 🤍<br>
  I have a sweet surprise for you…<br>
  Click the chocolate 🍫
</div>

<!-- Chocolate Lock -->
<div id="choco" class="chocolate">🍫</div>

<!-- Video -->
<div id="videoBox" class="video-box">
  <video controls autoplay loop playsinline>
    <source src="chocolate-video.mp4" type="video/mp4">
  </video>
</div>

<div class="footer">
  Forever yours,<br>
  <b>Kirthiga ❤️</b>
</div>

<script>
const choco = document.getElementById("choco");
const videoBox = document.getElementById("videoBox");

choco.addEventListener("click", () => {
  choco.classList.add("unwrap");

  setTimeout(() => {
    choco.style.display = "none";
    videoBox.style.display = "block";
  }, 1500);
});

// Floating hearts
setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(16+Math.random()*20)+"px";
  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),6000);
},400);
</script>

</body>
</html>
